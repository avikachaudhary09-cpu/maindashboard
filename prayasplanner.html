function syllabusSubjectsFromFile(parsed){
  if(parsed && parsed.format==='prayas-syllabus' && Array.isArray(parsed.subjects)){
    return parsed.subjects;
  }
  if(parsed && parsed.syllabus && Array.isArray(parsed.syllabus.subjects)){
    return parsed.syllabus.subjects;
  }
  if(Array.isArray(parsed)){
    return parsed;
  }
  // Also accept a full planner backup and extract only its syllabus fields.
  // This makes the two export/import paths interoperable if the wrong export
  // button is used.
  if(parsed && parsed.chapters && parsed.chapterOrder){
    return SUBJECTS.map(s=>({
      id:s.id,
      name:s.name,
      faculty:s.faculty,
      link:s.link,
      chapters:(parsed.chapterOrder[s.id]||[]).map(name=>({
        name,
        lectures:parsed.lectureOverrides &&
          parsed.lectureOverrides[s.id] &&
          parsed.lectureOverrides[s.id][name]
          ? parsed.lectureOverrides[s.id][name]
          : (s.chapters.find(c=>c.name===name)||{}).lectures||1,
        mode:parsed.chapters[s.id] && parsed.chapters[s.id][name] &&
          parsed.chapters[s.id][name].mode==='oneshot' ? 'oneshot' : 'regular',
        oneshotLink:parsed.chapters[s.id] && parsed.chapters[s.id][name]
           ? parsed.chapters[s.id][name].oneshotLink||'' : '',
         oneshotTitle:parsed.chapters[s.id] && parsed.chapters[s.id][name]
           ? parsed.chapters[s.id][name].oneshotTitle||'' : ''
      }))
    }));
  }
  return null;
}
function importSyllabusData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const subjects = syllabusSubjectsFromFile(parsed);
      if(!Array.isArray(subjects)){
        alert("This doesn't look like a valid syllabus export.");
        return;
      }
      const knownSubjects = new Map(SUBJECTS.map(s=>[s.id,s]));
      const imported = subjects.filter(s=>s && knownSubjects.has(s.id));
      const unknown = subjects.filter(s=>!s || !knownSubjects.has(s.id));
      if(unknown.length>0 || imported.length===0){
        alert('This syllabus was not exported from a compatible Manzil Planner.');
        return;
      }
      for(const importedSubject of imported){
        const baseSubject = knownSubjects.get(importedSubject.id);
        if(!Array.isArray(importedSubject.chapters) || importedSubject.chapters.length===0){
          alert(`No chapters found for ${baseSubject.name}.`);
          return;
        }
        const names = importedSubject.chapters.map(ch=>String(ch && ch.name || '').trim());
        if(names.some(name=>!name) || new Set(names).size!==names.length){
          alert(`The syllabus contains an empty or duplicate chapter in ${baseSubject.name}.`);
          return;
        }
      }
      imported.forEach(importedSubject=>{
        const sid = importedSubject.id;
        const previous = state.chapters[sid] || {};
        const nextChapters = {};
        const nextOverrides = {};
        importedSubject.chapters.forEach(ch=>{
          const name = String(ch.name).trim();
          const old = previous[name] || {};
          nextChapters[name] = {
            // Syllabus imports do not erase completion already recorded here.
            done:!!old.done,
            mode:ch.mode==='oneshot' ? 'oneshot' : 'regular',
              oneshotLink:String(ch.oneshotLink||'').trim(),
              oneshotTitle:String(ch.oneshotTitle||'').trim()
          };
          nextOverrides[name] = Math.max(1,parseInt(ch.lectures)||1);
        });
        state.chapterOrder[sid] = importedSubject.chapters.map(ch=>String(ch.name).trim());
        state.chapters[sid] = nextChapters;
        state.lectureOverrides[sid] = nextOverrides;
      });
      // The syllabus structure changed, so rebuild the generated schedule.
      // Progress, question logs, and completion history remain untouched.
      state.manualSchedule = {};
      state.revisionSelections = {};
      state.plan = [];
      state.planGenerated = false;
      if(state.setupDone) generatePlan();
      else saveState();
      render();
      alert(`Syllabus imported for ${imported.length} subject${imported.length!==1?'s':''}. Existing progress was kept.`);
    }catch(err){
      alert('Could not read this syllabus — make sure it is a valid JSON export.');
    }
  };
  reader.readAsText(file);
}

/* ---------------- YOUTUBE CSV IMPORT ---------------- */
function parseCsvRows(text){
  const rows=[], row=[];
  let cell='', quoted=false;
  const source=String(text||'').replace(/^\uFEFF/,'');
  for(let i=0;i<source.length;i++){
    const ch=source[i];
    if(quoted){
      if(ch==='"'){
        if(source[i+1]==='"'){ cell+='"'; i++; }
        else quoted=false;
      } else {
        cell+=ch;
      }
    } else if(ch==='"'){
      quoted=true;
    } else if(ch===','){
      row.push(cell); cell='';
    } else if(ch==='\n' || ch==='\r'){
      if(ch==='\r' && source[i+1]==='\n') i++;
      row.push(cell); cell='';
      if(row.some(value=>String(value).trim()!=='')) rows.push(row.splice(0,row.length));
    } else {
      cell+=ch;
    }
  }
  row.push(cell);
  if(row.some(value=>String(value).trim()!=='')) rows.push(row);
  return rows;
}
function csvHeaderKey(value){
  return String(value||'').trim().toLowerCase().replace(/[\s_-]+/g,'');
}
function videosFromCsv(text){
  const rows=parseCsvRows(text);
  if(rows.length<2) return {error:'The CSV is empty. Add a header row and at least one video.'};
  const headers=rows[0].map(csvHeaderKey);
  const titleIndex=headers.findIndex(h=>h==='title' || h==='videotitle' || h==='name');
  const linkIndex=headers.findIndex(h=>h==='videolink' || h==='link' || h==='url' || h==='videourl');
  if(titleIndex===-1 || linkIndex===-1){
    return {error:'Expected columns named "title" and "video link".'};
  }
  const seen=new Set(), seenTitles=new Set(), videos=[];
  rows.slice(1).forEach(row=>{
    const title=String(row[titleIndex]||'').trim();
    const link=externalHref(row[linkIndex]);
    const titleKey=title.toLowerCase();
    if(!title || !link || seen.has(link) || seenTitles.has(titleKey)) return;
    seen.add(link);
    seenTitles.add(titleKey);
    videos.push({title,link});
  });
  if(videos.length===0) return {error:'No valid videos were found. Each row needs a title and a valid video link.'};
  return {videos};
}
function cleanVideoList(videos){
  return Array.isArray(videos)
    ? videos.map(v=>({
        title:String(v && v.title || '').trim(),
        link:externalHref(v && v.link)
      })).filter(v=>v.title && v.link)
    : [];
}
function subjectVideos(sid){
  return state.videoLibraryBySubject && Array.isArray(state.videoLibraryBySubject[sid])
    ? state.videoLibraryBySubject[sid] : [];
}
function renderVideoLibraryRows(sid,limit=999){
  const videos=subjectVideos(sid);
  if(videos.length===0) return '';
  const visible=videos.slice(0,limit);
  return `<div class="video-library">
    ${visible.map(video=>`<div class="video-library-row">
      <div class="video-title" title="${escAttr(video.title)}">${escHtml(video.title)}</div>
      <a class="csv-video-open video-open" href="${escAttr(externalHref(video.link))}" target="_blank" rel="noopener noreferrer">Open ↗</a>
    </div>`).join('')}
    ${videos.length>limit ? `<div class="video-library-more">Showing ${limit} of ${videos.length} imported videos. All are available in the chapter pickers below.</div>` : ''}
  </div>`;
}
function syncSubjectChaptersFromVideos(sid,videos){
  const previous=state.chapters[sid] || {};
  state.chapterOrder[sid]=videos.map(video=>video.title);
  state.chapters[sid]={};
  state.lectureOverrides[sid]={};
  videos.forEach(video=>{
    const old=previous[video.title] || {};
    state.chapters[sid][video.title]={
      done:!!old.done,
      mode:'oneshot',
      oneshotLink:video.link,
      oneshotTitle:video.title
    };
  });
}
function resetToImportedCsvSubjects(){
  SUBJECTS.forEach(s=>syncSubjectChaptersFromVideos(s.id,subjectVideos(s.id)));
  state.manualSchedule={};
  state.revisionSelections={};
  state.plan=[];
  state.planGenerated=false;
}
function applySubjectVideos(sid,videos){
  if(!state.videoLibraryBySubject) state.videoLibraryBySubject={};
  state.videoLibraryBySubject[sid]=videos;
  syncSubjectChaptersFromVideos(sid,videos);
  resetToImportedCsvSubjects();
  if(state.setupDone) generatePlan();
  else saveState();
}
function importVideoCsv(file,sid){
  const reader=new FileReader();
  reader.onload=(e)=>{
    const result=videosFromCsv(e.target.result);
    if(result.error){ alert(result.error); return; }
    applySubjectVideos(sid,result.videos);
    render();
    const subjectName=(subj(sid)||{}).name || 'subject';
    alert(`${result.videos.length} chapter${result.videos.length===1?'':'s'} imported for ${subjectName}.`);
  };
  reader.onerror=()=>alert('Could not read this CSV file.');
  reader.readAsText(file);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !parsed.chapters || !parsed.chapterOrder){ alert("This file doesn't look like a valid Manzil Planner backup."); return; }
      state = migrateState(parsed);
      saveState(); render();
      alert('Backup restored successfully!');
    }catch(err){ alert('Could not read this file — make sure it is a valid backup JSON.'); }
  };
  reader.readAsText(file);
}

function questionPracticeChapterOptions(dateIso, currentIndex, entries){
  const day = state.plan.find(d=>d.date===dateIso);

    const key = item.subject+'::'+item.chapter;
    if(!plannedKeys.has(key)){
      plannedKeys.add(key);
      planned.push({sid:item.subject,ch:item.chapter,label:subj(item.subject)?.name||item.subject,planned:true});
    }
  });
  const rest = [];
  SUBJECTS.forEach(s=>state.chapterOrder[s.id].forEach(ch=>{
    const key = s.id+'::'+ch;
    if(!plannedKeys.has(key)) rest.push({sid:s.id,ch,label:s.name,planned:false});
  }));
  const options = planned.concat(rest);
  const used = new Set(entries.map((e,i)=>i===currentIndex?'':(e.subject&&e.chapter?e.subject+'::'+e.chapter:'')));
  const currentKey = entries[currentIndex].subject && entries[currentIndex].chapter
    ? entries[currentIndex].subject+'::'+entries[currentIndex].chapter : '';
  return `<option value="">Choose a chapter…</option>` + options.map(o=>{
    const key = o.sid+'::'+o.ch;
    const disabled = used.has(key) && key!==currentKey ? ' disabled' : '';
    const selected = key===currentKey ? ' selected' : '';
     return `<option value="${o.sid}::${escAttr(o.ch)}"${selected}${disabled}>${o.planned?'Planned today · ':''}${escHtml(o.label)} — ${escHtml(o.ch)}</option>`;
  }).join('');
}

function allChapterOptions(){
  let done=[], all=[];
  orderedSubjectIds().forEach(sid=>{
    const s=subj(sid);
    state.chapterOrder[s.id].forEach(ch=>{
      const entry = {sid:s.id, sname:s.name, ch};
      all.push(entry);
      const prog = chapterProgress(s.id,ch);
      if(prog.total>0 && prog.done===prog.total) done.push(entry);
    });
  });
  // Revision windows should suggest fully completed chapters first. If none
  // exist yet, keep the picker useful by showing every chapter.
  return done.length>0 ? done : all;
}

function testScoreEntries(){
  return Object.entries(state.holidayOptions||{})
    .map(([date,options])=>{
      const test=options && options.test;
      if(!test || !test.enabled) return null;
      const maxMarks=Math.max(1,parseInt(test.maxMarks)||1);
      const score=Math.max(0,Math.min(maxMarks,parseInt(test.score)||0));
      return {
        date,
        score,
        maxMarks,
        pct:Math.round(score/maxMarks*100),
        type:test.type||'JEE Mains',
        done:!!test.done
      };
    })
    .filter(Boolean)
    .sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---- QUESTIONS GRAPH (inline SVG, no deps) ---- */
function renderQuestionsGraph(){
  const data = last14DaysQuestionData();
  const maxVal = Math.max(1, ...data.map(d=>Math.max(d.done,d.goal)));
  const W=560, H=180, padL=30, padB=26, padT=10, padR=6;
  const chartW = W-padL-padR, chartH = H-padT-padB;
  const bw = chartW/data.length;
  const y = v => padT + chartH - (v/maxVal*chartH);
  let bars='', goalPts=[];
  data.forEach((d,i)=>{
    const x = padL + i*bw;
    const barH = (d.done/maxVal)*chartH;
    const over = d.done>d.goal;
    bars += `<rect x="${x+bw*0.18}" y="${y(d.done)}" width="${bw*0.64}" height="${barH}" rx="3" fill="${over?'var(--good)':'var(--accent)'}"></rect>`;
    goalPts.push(`${x+bw/2},${y(d.goal)}`);
    const lbl = fmtDate(d.date).split(',')[0];
    bars += `<text x="${x+bw/2}" y="${H-8}" font-size="9" fill="var(--muted)" text-anchor="middle">${lbl.split(' ')[0]}</text>`;
  });
  const goalLine = `<polyline points="${goalPts.join(' ')}" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4,3"></polyline>`;
  return `<div class="qgraph">
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="var(--line)"></line>
      <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="var(--line)"></line>
      ${bars}
      ${goalLine}
    </svg>
    <div class="legend">
      <span><i style="background:var(--accent)"></i>Questions done</span>
      <span><i style="background:var(--good)"></i>Goal beaten</span>
      <span><i style="background:var(--warn)"></i>Goal line</span>
    </div>
  </div>`;
}

      <div class="stat"><b>${fmtMinutes(dailyMinutes)}</b><span>Daily study time</span></div>
      <div class="stat"><b>${daysToComplete}d</b><span>Days to complete</span></div>
      <div class="stat"><b>${fmtDate(finishDate)}</b><span>Projected completion</span></div>
    </div>`;
  if(state.settingsPaceEditing){
    body += `<div class="row">
       <label class="field"><span class="lbl">m — Total lectures per day</span>
         <input type="number" min="1" max="20" id="s-pace2" data-act="sliveupdate" value="${totalLecturesPerDay}">
       </label>
       <label class="field"><span class="lbl">n — Subjects per day</span>
         <input type="number" min="1" max="5" id="s-subjday2" data-act="sliveupdate" value="${state.subjectsPerDay}">
      </label>
      <label class="field"><span class="lbl">Avg min/lecture</span>
        <input type="number" min="5" id="s-avgmin2" data-act="sliveupdate" value="${state.avgLectureMinutes}">
      </label>
    </div>
     <div class="note">The automatic plan keeps ${totalLecturesPerDay} total lecture slots/day. Each selected subject gets one first; remaining slots go to subjects with the most lectures left.</div>
    <button class="btn ghost sm" id="s-closepace">Done</button>`;
  } else {
    body += `<button class="btn ghost" id="s-changepace">Change pace</button>`;
  }
  return `<div class="card"><h2>Pace &amp; study time</h2><p class="sub">Completion time is calculated from the imported chapters and your selected daily pace.</p>${body}</div>`;
}

function externalHref(value){
  const raw = String(value||'').trim();
  if(!raw) return '';
  const candidate = /^[a-z][a-z\d+\-.]*:/i.test(raw) ? raw : 'https://'+raw;
  try{
    const url = new URL(candidate);
    return (url.protocol==='http:' || url.protocol==='https:') ? url.href : '';
  }catch(e){ return ''; }
}
function escAttr(s){
  return String(s??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

/* ---------------- EVENT HANDLING ---------------- */
function attachHandlers(){
  const themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.onclick = ()=>{ state.theme = state.theme==='dark'?'light':'dark'; saveState(); render(); };

  document.querySelectorAll('.sidebar-nav button').forEach(b=>{
    b.onclick = ()=>{ state.view = b.dataset.view; render(); };
  });

  // sidebar tabs (Questions / Revision)
  document.querySelectorAll('[data-act="sbtab"]').forEach(el=>{
    el.onclick = ()=>{ state.sidebarTab = el.dataset.tab; saveState(); render(); };
  });

  // add a manual revision task from the sidebar
  const sbAddRevision = document.getElementById('sb-addrevision');
  if(sbAddRevision) sbAddRevision.onclick = ()=>{
    const sel = document.getElementById('sb-revisionchapter');
    if(!sel || !sel.value) return;
    const [sid, chName] = sel.value.split('::');
    if(addManualRevision(sid, chName)) render();
  };

  // remove a revision task (manual or free-time), from sidebar or plan views
  document.querySelectorAll('[data-act="removerevision"]').forEach(el=>{
    el.onclick = ()=>{
      removeRevisionItem(el.dataset.day, el.dataset.id);
      render();
    };
  });

  // wizard step 0
  const wnext0 = document.getElementById('w-next0');
  if(wnext0) wnext0.onclick = ()=>{
    if(!state.csvSetupPrepared){
      resetToImportedCsvSubjects();
      state.csvSetupPrepared=true;
      saveState();
    }
    state.startDate = normalizeISODate(document.getElementById('w-start').value, state.startDate);
    state.wizardStep = 1; saveState(); render();
  };
  const wizardImportBackup = document.getElementById('w-importbackup');
  if(wizardImportBackup) wizardImportBackup.onclick = ()=>document.getElementById('w-importbackupfile').click();
  const wizardImportBackupFile = document.getElementById('w-importbackupfile');
  if(wizardImportBackupFile) wizardImportBackupFile.onchange = (e)=>{
    if(e.target.files[0]) importData(e.target.files[0]);
    e.target.value='';
  };

  const wback = document.getElementById('w-back');
  if(wback) wback.onclick = ()=>{ state.wizardStep = Math.max(0,state.wizardStep-1); render(); };

  const wnextsub = document.getElementById('w-nextsub');
  if(wnextsub) wnextsub.onclick = ()=>{ state.wizardStep++; render(); };

  document.querySelectorAll('[data-act="ordermove"]').forEach(el=>{
    el.onclick=()=>{
      const target=el.dataset.kind==='chemistry' ? state.chemistryOrder : state.subjectOrder;
      const index=parseInt(el.dataset.idx), next=index+parseInt(el.dataset.dir);
      if(next<0 || next>=target.length) return;
      [target[index],target[next]]=[target[next],target[index]];
      saveState(); render();
    };
  });
  const wnextorder=document.getElementById('w-nextorder');
  if(wnextorder) wnextorder.onclick=()=>{ state.wizardStep=7; saveState(); render(); };

  document.querySelectorAll('[data-act="wliveupdate"]').forEach(el=>{
    el.onchange = ()=>{
      if(el.id==='w-subjday') state.subjectsPerDay = Math.min(5,Math.max(1,parseInt(el.value)||1));
      if(el.id==='w-avgmin') state.avgLectureMinutes = Math.max(5,parseInt(el.value)||30);
      if(el.id==='w-pace'){ state.lecturesPerDay = Math.min(20,Math.max(1,parseInt(el.value)||1)); state.paceChoice='custom'; }
      if(el.id!=='w-pace') state.paceChoice = null;
      render();
    };
  });
  document.querySelectorAll('[data-act="wpicktier"]').forEach(el=>{
    el.onclick = ()=>{
      state.paceChoice = el.dataset.tier;
      state.lecturesPerDay = parseInt(el.dataset.lecperday)||2;
      render();
    };
  });
  const wgen = document.getElementById('w-generate');
  if(wgen) wgen.onclick = ()=>{
    state.setupDone = true; state.view='today';
    generatePlan(); render();
  };

  // DPP: yes / no / block toggle per lecture task
  document.querySelectorAll('[data-act="dpptoggle"]').forEach(el=>{
    el.onclick = ()=>{
      setDppStatus(el.dataset.id, el.dataset.value);
      saveState(); render();
    };
  });
  // today / full plan task toggles
  document.querySelectorAll('[data-act="tasktoggle"]').forEach(el=>{
    el.onchange = ()=>{
      const dayDate = el.dataset.day, id = el.dataset.id;
      const day = state.plan.find(d=>d.date===dayDate);
      let item = day ? findDisplayItem(day,id) : null;
      if(item) item.done = el.checked;
      if(item && day && day.holiday){
        const opts=holidayOptionState(dayDate);
        if(item.type==='holiday-practice' && opts.practice) opts.practice.done=el.checked;
        if(item.type==='holiday-revision' && opts.revision) opts.revision.done=el.checked;
        if(item.type==='test' && opts.test) opts.test.done=el.checked;
      }
      if(el.checked){
        state.completedItems[id] = true;
        if(item){
          state.completionLog.push({
            id, subject:item.subject, chapter:item.chapter,
            part: item.type==='oneshot' ? 'One Shot' :
              (item.type==='revision' ? 'Revision' :
              (item.type==='chapter-practice' || item.type==='holiday-practice' ? 'Question Practice' :
              (item.type==='holiday-revision' ? 'Holiday Revision' :
              (item.type==='test' ? 'Test' : ('Lecture '+item.lectureNum))))),
            date: todayISO(), ts: Date.now()
          });
        }
        if(item && (item.type==='lecture' || item.type==='oneshot' || item.type==='revision' || item.type==='chapter-practice' || item.type==='holiday-practice' || item.type==='holiday-revision')){
          const label = item.type==='oneshot' ? 'this One Shot' :
            (item.type==='revision' || item.type==='holiday-revision' ? 'this revision session' :
            (item.type==='chapter-practice' || item.type==='holiday-practice' ? 'this chapter practice' : 'this lecture'));
          const n = item.type==='holiday-practice' && item.questions ? item.questions : askQuestionsFor('How many questions did you solve for '+label+'?');
          if(n>0){ state.questionsByItem[id] = n; addQuestions(dayDate, n); }
        }
      } else {
        delete state.completedItems[id];
        for(let i=state.completionLog.length-1;i>=0;i--){
          if(state.completionLog[i].id===id && state.completionLog[i].date===todayISO()){ state.completionLog.splice(i,1); break; }
        }
        if(state.questionsByItem[id]){
          addQuestions(dayDate, -state.questionsByItem[id]);
          delete state.questionsByItem[id];
        }
      }
      saveState(); render();
    };
  });

  // Question practice window: at most three chapter/count pairs per day.
  document.querySelectorAll('[data-act="addpractice"]').forEach(el=>{
    el.onclick = ()=>{
      const entries = questionPracticeEntries(el.dataset.day);
      if(entries.length>=3) return;
      entries.push({subject:'',chapter:'',questions:0});
      setQuestionPracticeEntries(el.dataset.day, entries);
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="removepractice"]').forEach(el=>{
    el.onclick = ()=>{
      const entries = questionPracticeEntries(el.dataset.day);
      const index = parseInt(el.dataset.index);
      const removed = entries[index];
      if(removed && removed.done && removed.subject && removed.chapter) addQuestions(el.dataset.day,-removed.questions);
      entries.splice(index,1);
      setQuestionPracticeEntries(el.dataset.day, entries);
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="practicechapter"]').forEach(el=>{
    el.onchange = ()=>{
      const entries = questionPracticeEntries(el.dataset.day);
      const index = parseInt(el.dataset.index);
      const [sid,chName] = (el.value||'::').split('::');
      if(entries[index]){
        if(entries[index].done && entries[index].subject && entries[index].chapter && (!sid || !chName)){
          addQuestions(el.dataset.day,-entries[index].questions);
          entries[index].done = false;
        }
        entries[index].subject = sid || '';
        entries[index].chapter = chName || '';
      }
      setQuestionPracticeEntries(el.dataset.day, entries);
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="practicetoggle"]').forEach(el=>{
    el.onchange = ()=>{
      const entries = questionPracticeEntries(el.dataset.day);
      const index = parseInt(el.dataset.index);
      const entry = entries[index];
      if(!entry) return;
      entry.done = el.checked;
      addQuestions(el.dataset.day, el.checked ? entry.questions : -entry.questions);
      setQuestionPracticeEntries(el.dataset.day, entries);
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="practicecount"]').forEach(el=>{
    el.onchange = ()=>{
      const entries = questionPracticeEntries(el.dataset.day);
      const index = parseInt(el.dataset.index);
      if(entries[index]){
        const next = Math.max(0,parseInt(el.value)||0);
        if(entries[index].done && entries[index].subject && entries[index].chapter){
          addQuestions(el.dataset.day,next-entries[index].questions);
        }
        entries[index].questions = next;
      }
      setQuestionPracticeEntries(el.dataset.day, entries);
      saveState(); render();
    };
  });

  // revision slot chapter picker
  document.querySelectorAll('[data-act="revisionpick"]').forEach(el=>{
    el.onchange = ()=>{
      if(!el.value) return;
      const dayDate = el.dataset.day, id = el.dataset.id;
      const day = state.plan.find(d=>d.date===dayDate);
      const item = day ? day.items.find(i=>i.id===id) : null;
      if(item){
        const [sid,chName] = el.value.split('::');
        item.subject = sid; item.chapter = chName;
        state.revisionSelections[id] = {subject:sid, chapter:chName};
      }
      saveState(); render();
    };
  });

  // Explicitly move one pending lecture or one-shot. Automatic scheduling is
  // untouched for every task the user does not choose here.
  document.querySelectorAll('[data-act="reschedule"]').forEach(el=>{
    el.onclick = ()=>{
      const itemId = document.getElementById('reschedule-item')?.value;
      const targetDate = document.getElementById('reschedule-date')?.value;
      if(!itemId || !targetDate) return;
      if(!state.manualSchedule) state.manualSchedule = {};
      state.manualSchedule[itemId] = targetDate;
      const current = (state.plan||[]).flatMap(d=>d.items).find(i=>i.id===itemId);
      if(current && current.type==='oneshot'){
        state.manualSchedule['revision-window::'+itemId] = targetDate;
      }
      generatePlan();
      render();
    };
  });

  // log DPP / extra questions
  document.querySelectorAll('[data-act="logdpp"]').forEach(el=>{
    el.onclick = ()=>{
      const dayDate = el.dataset.day;
      const n = askQuestionsFor('How many DPP / module questions did you solve?');
      if(n>0){ addQuestions(dayDate, n); saveState(); render(); }
    };
  });

  // sidebar: daily question goal
  const sbSetToday = document.getElementById('sb-settoday');
  if(sbSetToday) sbSetToday.onclick = ()=>{
    const v = Math.max(1, parseInt(document.getElementById('sb-goalinput').value)||60);
    state.questionGoalOverrides[todayISO()] = v;
    saveState(); render();
  };
  const sbSetPermanent = document.getElementById('sb-setpermanent');
  if(sbSetPermanent) sbSetPermanent.onclick = ()=>{
    const v = Math.max(1, parseInt(document.getElementById('sb-goalinput').value)||60);
    state.dailyQuestionGoal = v;
    delete state.questionGoalOverrides[todayISO()];
    saveState(); render();
  };
  const sbQuickAdd = document.getElementById('sb-quickadd');
  if(sbQuickAdd) sbQuickAdd.onclick = ()=>{
    const n = askQuestionsFor('How many questions do you want to log for today?');
    if(n>0){ addQuestions(todayISO(), n); saveState(); render(); }
  };

  document.querySelectorAll('[data-act="toggleday"]').forEach(el=>{
    el.onclick = ()=>{
      const d = el.dataset.day;
      state.openDay = state.openDay===d ? null : d;
      render();
    };
  });

  // skip today
  const openSkip = document.getElementById('openSkip');
  if(openSkip) openSkip.onclick = ()=>{ state.skipPromptOpen = true; render(); };
  const cancelSkip = document.getElementById('cancelSkip');
  if(cancelSkip) cancelSkip.onclick = ()=>{ state.skipPromptOpen = false; render(); };
  const confirmSkip = document.getElementById('confirmSkip');
  if(confirmSkip) confirmSkip.onclick = ()=>{
    const reason = document.getElementById('skipReason').value;
    skipToday(reason);
    state.skipPromptOpen = false;
    render();
  };

  // settings
  document.querySelectorAll('[data-act="settheme"]').forEach(el=>{
    el.onclick = ()=>{ state.theme = el.dataset.theme; saveState(); render(); };
  });
  const saveBaseline = document.getElementById('s-savebaseline');
  if(saveBaseline) saveBaseline.onclick = ()=>{
    state.startDate = normalizeISODate(document.getElementById('s-start').value, state.startDate);
    generatePlan(); render();
  };
  const saveHoliday = document.querySelector('[data-act="saveholiday"]');
  if(saveHoliday) saveHoliday.onclick = ()=>{
    const weekday = parseInt(document.getElementById('s-holidayweekday').value);
    if(Number.isInteger(weekday) && weekday>=0 && weekday<=6) state.holidayWeekday = weekday;
    state.manualSchedule = {};
    generatePlan();
    render();
  };

  const changePace = document.getElementById('s-changepace');
  if(changePace) changePace.onclick = ()=>{ state.settingsPaceEditing = true; render(); };
  const closePace = document.getElementById('s-closepace');
  if(closePace) closePace.onclick = ()=>{ state.settingsPaceEditing = false; generatePlan(); render(); };
  document.querySelectorAll('[data-act="sliveupdate"]').forEach(el=>{
    el.onchange = ()=>{
      if(el.id==='s-subjday2') state.subjectsPerDay = Math.min(5,Math.max(1,parseInt(el.value)||1));
      if(el.id==='s-avgmin2') state.avgLectureMinutes = Math.max(5,parseInt(el.value)||30);
      if(el.id==='s-pace2'){ state.lecturesPerDay = Math.min(20,Math.max(1,parseInt(el.value)||1)); state.paceChoice='custom'; }
      render();
    };
  });
  document.querySelectorAll('[data-act="spicktier"]').forEach(el=>{
    el.onclick = ()=>{
      state.paceChoice = el.dataset.tier;
      state.lecturesPerDay = parseInt(el.dataset.lecperday)||2;
      state.settingsPaceEditing = false;
      generatePlan(); render();
    };
  });

  document.querySelectorAll('[data-act="saveorder"]').forEach(el=>{
    el.onclick=()=>{ state.manualSchedule={}; generatePlan(); render(); };
  });
  document.querySelectorAll('[data-act="chaptermove"]').forEach(el=>{
    el.onclick=()=>{
      const sid=el.dataset.sub, order=state.chapterOrder[sid]||[];
      const index=parseInt(el.dataset.idx), next=index+parseInt(el.dataset.dir);
      if(next<0 || next>=order.length) return;
      [order[index],order[next]]=[order[next],order[index]];
      state.manualSchedule={}; generatePlan(); render();
    };
  });
  document.querySelectorAll('[data-act="holidaypracticechapter"]').forEach(el=>{
    el.onchange=()=>{
      const opts=holidayOptionState(el.dataset.day);
      const [sid,ch]=String(el.value||'::').split('::');
      opts.practice=Object.assign({},opts.practice,{subject:sid||'',chapter:ch||'',done:false});
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="holidaypracticecount"]').forEach(el=>{
    el.onchange=()=>{
      const opts=holidayOptionState(el.dataset.day);
      opts.practice=Object.assign({},opts.practice,{questions:Math.max(0,parseInt(el.value)||0)});
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="holidayrevisionchapter"]').forEach(el=>{
    el.onchange=()=>{
      const opts=holidayOptionState(el.dataset.day);
      const [sid,ch]=String(el.value||'::').split('::');
      opts.revision=Object.assign({},opts.revision,{subject:sid||'',chapter:ch||'',done:false});
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="holidaytesttoggle"]').forEach(el=>{
    el.onchange=()=>{
      const opts=holidayOptionState(el.dataset.day);
      opts.test=Object.assign({},opts.test,{enabled:el.checked,type:(opts.test&&opts.test.type)||'JEE Mains',papers:(opts.test&&opts.test.papers)||'1'});
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="holidaytesttype"]').forEach(el=>{
    el.onchange=()=>{
      const opts=holidayOptionState(el.dataset.day);
      opts.test=Object.assign({},opts.test,{type:el.value});
      saveState(); render();
    };

  document.querySelectorAll('[data-act="holidaytestpapers"]').forEach(el=>{
    el.onchange=()=>{
      const opts=holidayOptionState(el.dataset.day);
      opts.test=Object.assign({},opts.test,{papers:el.value});
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="holidaytestmax"]').forEach(el=>{
    el.onchange=()=>{
      const opts=holidayOptionState(el.dataset.day);
      opts.test=Object.assign({},opts.test,{maxMarks:Math.max(1,parseInt(el.value)||1)});
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="holidaytestscore"]').forEach(el=>{
    el.onchange=()=>{
      const opts=holidayOptionState(el.dataset.day);
      opts.test=Object.assign({},opts.test,{score:Math.max(0,parseInt(el.value)||0)});
      saveState(); render();
    };
  });

  document.querySelectorAll('[data-act="ssubjtab"]').forEach(el=>{
    el.onclick = ()=>{ settingsActiveSubj = el.dataset.sub; render(); };
  });

  const exportBtn = document.getElementById('s-export');
  if(exportBtn) exportBtn.onclick = exportData;
  const importBtn = document.getElementById('s-importbtn');
  if(importBtn) importBtn.onclick = ()=>document.getElementById('s-importfile').click();
  const importFile = document.getElementById('s-importfile');
  if(importFile) importFile.onchange = (e)=>{ if(e.target.files[0]) importData(e.target.files[0]); };
  document.querySelectorAll('[data-act="importsubjectcsv"]').forEach(button=>{
    button.onclick = ()=>{
      const input=document.getElementById(button.dataset.target);
      if(input) input.click();
    };
  });
  document.querySelectorAll('[data-act="subjectcsvfile"]').forEach(input=>{
    input.onchange = (e)=>{
      if(e.target.files[0]) importVideoCsv(e.target.files[0],input.dataset.sub);
      e.target.value='';
    };
  });

  const rerun = document.getElementById('s-rerunwizard');
  if(rerun) rerun.onclick = ()=>{ state.setupDone = false; state.wizardStep = 0; state.csvSetupPrepared = false; saveState(); render(); };
  const hardReset = document.getElementById('s-hardreset');
  if(hardReset) hardReset.onclick = ()=>{
    if(confirm('This will permanently erase all your progress and settings on this device. Export a backup first if you want to keep it. Continue?')){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state = defaultState();
      render();
    }
  };
}

/* ---------------- INIT ---------------- */
(function init(){
  loadState();
  state.view='today';
  ensurePlanFresh();
  render();
})();
</script>
</body>
</html>
