<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayas Catch-Up Planner</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --panel2:#f5f7fb; --text:#171a23; --muted:#5c6272;
  --line:#dde1ec; --accent:#31439e; --accent-ink:#ffffff; --good:#1b8a5a; --warn:#b5691a;
  --one:#a6461f; --one-bg:#fdeee6; --chip:#e7eaf5; --shadow:0 6px 20px rgba(30,40,80,.08);
  --radius:14px;
}
body.dark{
  --bg:#12141c; --panel:#1b1e29; --panel2:#20232f; --text:#e9ebf3; --muted:#9298ab;
  --line:#2c3040; --accent:#7c8cf5; --accent-ink:#0e1020; --good:#4fd08a; --warn:#f0b54c;
  --one:#f0a06e; --one-bg:#2c1f18; --chip:#262a3a; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,-apple-system,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7c8cf5);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.brand h1{font-size:17px;margin:0;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px}
nav.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
nav.tabs button{flex:1;min-width:90px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:600}
nav.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:16px}
.card p.sub{margin:0 0 14px;color:var(--muted);font-size:13px}
label.field{display:block;margin-bottom:14px}
label.field span.lbl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
input[type=text],input[type=number],input[type=date],select{
  width:100%;padding:10px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px
}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > label.field{flex:1;min-width:150px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;justify-content:space-between;margin-top:18px;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--chip);color:var(--muted)}
.pill.on{background:var(--good);color:#08301c}
.pill.one{background:var(--one-bg);color:var(--one)}
.chapter-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.chapter-row:last-child{border-bottom:none}
.chapter-row .name{flex:1}
.chapter-row .lectures{color:var(--muted);font-size:11.5px;min-width:58px}
.chapter-row.done .name{text-decoration:line-through;color:var(--muted)}
.mini-order{display:flex;flex-direction:column;gap:2px}
.mini-order button{width:22px;height:18px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;font-size:10px;cursor:pointer;color:var(--text)}
.link-input{width:180px}
.subtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.subtabs button{white-space:nowrap;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer}
.subtabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat{background:var(--panel2);border-radius:11px;padding:12px 14px;flex:1;min-width:140px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11.5px;color:var(--muted)}
.daycard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.daycard.istoday{border:2px solid var(--accent)}
.daycard .dayhead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;background:var(--panel2)}
.daycard .dayhead b{font-size:13.5px}
.daycard .dayhead .meta{color:var(--muted);font-size:11.5px}
.daycard .body{padding:6px 12px 12px}
.taskrow{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}
.taskrow:last-child{border-bottom:none}
.taskrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.taskrow .txt{flex:1;font-size:13.5px}
.taskrow .txt.done{text-decoration:line-through;color:var(--muted)}
.taskrow .sub{font-size:11px;color:var(--muted)}
.taskrow a.openbtn{font-size:11.5px;padding:6px 10px;border-radius:8px;background:var(--chip);color:var(--text);text-decoration:none;font-weight:700;white-space:nowrap}
.badge-oneshot{background:var(--one-bg);color:var(--one);padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:800;margin-left:6px}
.progress-outer{background:var(--panel2);border-radius:99px;height:8px;overflow:hidden;margin-top:6px}
.progress-inner{background:var(--good);height:100%;transition:width .3s}
.note{font-size:12px;color:var(--muted);background:var(--panel2);padding:10px 12px;border-radius:9px;margin-top:8px}
.warnbox{background:var(--one-bg);color:var(--one);padding:10px 12px;border-radius:9px;font-size:12.5px;margin-top:10px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px;font-weight:800}
.emptystate{text-align:center;padding:40px 14px;color:var(--muted)}
.toggle-group{display:flex;gap:8px}
.toggle-group button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:700;font-size:13px}
.toggle-group button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.settings-list button.linklike{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-size:13px;padding:0}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
.quotebar{background:linear-gradient(135deg,var(--accent),#7c8cf5);color:#fff;padding:12px 16px;border-radius:var(--radius);font-size:13px;font-style:italic;margin-bottom:14px;box-shadow:var(--shadow)}
.pacegrid{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.pacecard{flex:1;min-width:150px;border:2px solid var(--line);background:var(--panel2);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
.pacecard:hover{border-color:var(--accent)}
.pacecard.selected{border-color:var(--accent);background:var(--chip)}
.pacecard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13.5px}
.pacecard-body{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.skipbox{background:var(--panel2);border-radius:11px;padding:12px;margin-top:12px}
.subjectprogress-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.subjectprogress-row .name{min-width:130px}
.subjectprogress-row .pct{min-width:50px;text-align:right;color:var(--muted);font-size:11.5px}
.logrow{font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:none}
.streakline{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>

 chapters:[

  {name:'States of Matter',lectures:1},
  {name:'The Solid State',lectures:1},
  {name:'Surface Chemistry',lectures:1}
 ]}
];

const QUOTES = [
 "Small steps every day beat big leaps once in a while.",
 "Discipline is choosing what you want most over what you want now.",
 "Consistency compounds — one lecture at a time.",
 "You don't have to be extreme, just consistent.",
 "The syllabus doesn't finish itself. Today is a good day to start.",
 "Progress, not perfection.",
 "Future you is watching — make them proud today.",
 "One chapter today is one less chapter tomorrow.",
 "Motivation gets you started. Habit keeps you going.",
 "It always seems impossible until it's done.",
 "Every lecture you finish is a rank you're earning.",
 "Don't count the days, make the days count.",
 "Hard work beats talent when talent doesn't work hard.",
 "You are one focused session away from a good day.",
 "Slow progress is still progress.",
 "The best time to study was yesterday. The next best time is now.",
 "Push yourself, because no one else is going to do it for you.",
 "Success is the sum of small efforts repeated daily."
];

const SKIP_REASONS = ['Fever / Unwell','Procrastination','Guests at home','Festival','Market / Errands','Test / Exam','Family function','Travel','Other'];

/* ---------------- STATE ---------------- */
let state = null;
const STORAGE_KEY = 'prayas-planner-state-v2';

/* Uses LOCAL date parts (not UTC) so "today" is correct regardless of timezone/time of day */
function todayISO(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
/* All calendar math below is done in UTC internally purely as neutral date arithmetic (no timezone drift) */
function addDays(iso,n){
  const parts = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  dt.setUTCDate(dt.getUTCDate()+n);
  return dt.toISOString().slice(0,10);
}
function fmtDate(iso){
  const parts = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));
  return dt.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
}
function fmtMinutes(mins){
  mins = Math.max(0,Math.round(mins));
  if(mins<60) return mins+' min';
  const h = Math.floor(mins/60), m = mins%60;
  return h+'h'+(m?' '+m+'m':'');
}
function todaysQuote(){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,0);
  const dayOfYear = Math.floor((d-start)/86400000);
  return QUOTES[((dayOfYear%QUOTES.length)+QUOTES.length)%QUOTES.length];
}

function defaultState(){
  const chapters={}, chapterOrder={};
  SUBJECTS.forEach(s=>{
    chapters[s.id]={};
    chapterOrder[s.id]=s.chapters.map(c=>c.name);
    s.chapters.forEach(c=>{ chapters[s.id][c.name]={done:false,mode:'regular',oneshotLink:''}; });
  });
  return {
    theme:'light', setupDone:false, wizardStep:0,
    startDate: todayISO(), targetDays:60,
    avgLectureMinutes:30, lecturesPerDay:2, subjectsPerDay:2, paceChoice:null,
    subjectOrder: SUBJECTS.map(s=>s.id),
    chapters, chapterOrder,
    plan: [], planGenerated:false,
    skippedDates: [], skipLog: [], completedItems: {}, completionLog: [],
    view:'today', openDay:null, skipPromptOpen:false, settingsPaceEditing:false
  };
}

function migrateState(parsed){
  const def = defaultState();
  const merged = Object.assign({}, def, parsed);
  merged.completedItems = parsed.completedItems || {};
  merged.completionLog = parsed.completionLog || [];
  merged.skippedDates = parsed.skippedDates || [];
  merged.skipLog = parsed.skipLog || [];
  merged.startDate = parsed.startDate || parsed.today || def.startDate;
  merged.avgLectureMinutes = parsed.avgLectureMinutes || def.avgLectureMinutes;
  merged.chapters = parsed.chapters || def.chapters;
  merged.chapterOrder = parsed.chapterOrder || def.chapterOrder;
  merged.subjectOrder = parsed.subjectOrder || def.subjectOrder;
  merged.plan = parsed.plan || [];
  merged.skipPromptOpen = false;
  merged.settingsPaceEditing = false;
  return merged;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ state = migrateState(JSON.parse(raw)); return; }
  }catch(e){ console.warn('Could not load saved plan', e); }
  state = defaultState();
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('Could not save plan', e); }
}

/* ---------------- HELPERS ---------------- */
function subj(id){ return SUBJECTS.find(s=>s.id===id); }
function itemKey(sid,chName,part){ return sid+'::'+chName+'::'+part; }

function remainingChapters(sid){
  return state.chapterOrder[sid].filter(n=>!state.chapters[sid][n].done);
}
function totalRemainingLectureCount(sid){
  let n=0;
  remainingChapters(sid).forEach(ch=>{
    const cfg=state.chapters[sid][ch];
    const chObj=subj(sid).chapters.find(c=>c.name===ch);
    if(cfg.mode==='oneshot') return;
    for(let i=1;i<=chObj.lectures;i++){
      if(!state.completedItems[itemKey(sid,ch,i)]) n++;
    }
  });
  return n;
}
function oneShotCount(sid){
  return remainingChapters(sid).filter(ch=>{
    const cfg=state.chapters[sid][ch];
    if(cfg.mode!=='oneshot') return false;
    return !state.completedItems[itemKey(sid,ch,'oneshot')];
  }).length;
}
function remainingTotalLectures(){ let n=0; SUBJECTS.forEach(s=>n+=totalRemainingLectureCount(s.id)); return n; }
function remainingTotalOneshots(){ let n=0; SUBJECTS.forEach(s=>n+=oneShotCount(s.id)); return n; }

function chapterProgress(sid,chName){
  const cfg = state.chapters[sid][chName];
  const chObj = subj(sid).chapters.find(c=>c.name===chName);
  if(cfg.mode==='oneshot'){
    const done = (cfg.done || state.completedItems[itemKey(sid,chName,'oneshot')]) ? 1:0;
    return {done, total:1};
  }
  let done=0;
  for(let i=1;i<=chObj.lectures;i++){
    if(cfg.done || state.completedItems[itemKey(sid,chName,i)]) done++;
  }
  return {done, total:chObj.lectures};
}
function subjectTotals(sid){
  let total=0, done=0;
  subj(sid).chapters.forEach(c=>{
    const p = chapterProgress(sid,c.name);
    total+=p.total; done+=p.done;
  });
  return {total,done};
}
function syllabusTotals(){
  let total=0, done=0;
  SUBJECTS.forEach(s=>{ const t=subjectTotals(s.id); total+=t.total; done+=t.done; });
  return {total,done};
}
function computeStreak(){
  const days = new Set((state.completionLog||[]).map(e=>e.date));
  let cursor = todayISO();
  if(!days.has(cursor)) cursor = addDays(cursor,-1);
  let streak=0, guard=0;
  while(days.has(cursor) && guard<3660){ streak++; cursor=addDays(cursor,-1); guard++; }
  return streak;
}

/* ---------------- PACE SUGGESTIONS ---------------- */
function computePaceTiers(){
  const totalLec = remainingTotalLectures();
  const totalOne = remainingTotalOneshots();
  const availDays = Math.max(1, state.targetDays - totalOne);
  const minCombined = Math.max(1, Math.ceil(totalLec/availDays));
  const defs = [
    {key:'relaxed', label:'Relaxed', mult:1},
    {key:'balanced', label:'Balanced', mult:1.3},
    {key:'intensive', label:'Intensive', mult:1.6}
  ];
  const seenLPD = new Set();
  const start = planStartDate();
  return defs.map(d=>{
    let combinedTarget = Math.max(1, Math.round(minCombined*d.mult));
    let lecturesPerDay = Math.max(1, Math.ceil(combinedTarget/state.subjectsPerDay));
    while(seenLPD.has(lecturesPerDay)){ combinedTarget += state.subjectsPerDay; lecturesPerDay = Math.max(1, Math.ceil(combinedTarget/state.subjectsPerDay)); }
    seenLPD.add(lecturesPerDay);
    const actualCombined = lecturesPerDay*state.subjectsPerDay;
    const estDays = totalLec>0 ? Math.ceil(totalLec/actualCombined)+totalOne : totalOne;
    const finishDate = addDays(start, Math.max(0,estDays-1));
    const dailyMinutes = actualCombined*state.avgLectureMinutes;
    return {key:d.key,label:d.label,combinedPace:actualCombined,lecturesPerDay,estDays,finishDate,dailyMinutes};
  });
}
function planStartDate(){
  const real = todayISO();
  return (state.startDate && state.startDate>real) ? state.startDate : real;
}
function nextScheduledDate(dateIso){
  let d = dateIso, guard=0;
  while(state.skippedDates.indexOf(d)!==-1 && guard<3660){ d = addDays(d,1); guard++; }
  return d;
}

/* ---------------- PLAN GENERATION ---------------- */
function buildSubjectQueue(sid){
  const tasks=[];
  remainingChapters(sid).forEach(chName=>{
    const cfg=state.chapters[sid][chName];
    const chObj=subj(sid).chapters.find(c=>c.name===chName);
    if(cfg.mode==='oneshot'){
      const key = itemKey(sid,chName,'oneshot');
      if(!state.completedItems[key]) tasks.push({type:'oneshot',subject:sid,chapter:chName,link:cfg.oneshotLink||'',id:key});
    } else {
      for(let i=1;i<=chObj.lectures;i++){
        const key = itemKey(sid,chName,i);
        if(!state.completedItems[key]) tasks.push({type:'lecture',subject:sid,chapter:chName,lectureNum:i,totalLectures:chObj.lectures,id:key});
      }
    }
  });
  return tasks;
}

function generatePlan(){
  const active = state.subjectOrder.filter(sid=>buildSubjectQueue(sid).length>0);
  const queues={}; active.forEach(sid=>queues[sid]=buildSubjectQueue(sid));
  let rotation=[...active];
  const plan=[];
  let dateCursor = nextScheduledDate(planStartDate());
  const N = state.subjectsPerDay;
  const pace = state.lecturesPerDay;
  let guard=0;
  while(rotation.length>0 && guard<8000){
    guard++;
    const picks=[];
    while(picks.length<N && rotation.length>0){ picks.push(rotation.shift()); }
    let oneshotPick=null;
    for(const sid of picks){ if(queues[sid][0] && queues[sid][0].type==='oneshot'){ oneshotPick=sid; break; } }
    const dayItems=[];
    if(oneshotPick){
      const t=queues[oneshotPick].shift();
      dayItems.push(Object.assign({},t,{done:!!state.completedItems[t.id]}));
      const others = picks.filter(p=>p!==oneshotPick);
      rotation = others.concat(rotation);
      if(queues[oneshotPick].length>0) rotation.push(oneshotPick);
    } else {
      for(const sid of picks){
        const chunk = queues[sid].splice(0,pace);
        chunk.forEach(t=>dayItems.push(Object.assign({},t,{done:!!state.completedItems[t.id]})));
        if(queues[sid].length>0) rotation.push(sid);
      }
    }
    if(dayItems.length>0){
      plan.push({date:dateCursor, items:dayItems});
      dateCursor = nextScheduledDate(addDays(dateCursor,1));
    }
  }
  state.plan = plan;
  state.planGenerated = true;
  saveState();
}

function ensurePlanFresh(){
  if(!state.planGenerated || state.plan.length===0) return;
  const last = state.plan[state.plan.length-1].date;
  if(last < todayISO()) generatePlan();
}

/* ---------------- SKIP DAY ---------------- */
function skipToday(reason){
  const real = todayISO();
  if(state.skippedDates.indexOf(real)===-1) state.skippedDates.push(real);
  state.skipLog.push({date:real, reason, ts:Date.now()});
  generatePlan();
}

/* ---------------- EXPORT / IMPORT ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'prayas-planner-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !parsed.chapters || !parsed.chapterOrder){ alert("This file doesn't look like a valid Prayas Planner backup."); return; }
      state = migrateState(parsed);
      saveState(); render();
      alert('Backup restored successfully!');
    }catch(err){ alert('Could not read this file — make sure it is a valid backup JSON.'); }
  };
  reader.readAsText(file);
}

}

function renderToday(){
  if(!state.planGenerated){
    return `<div class="card emptystate"><p>No plan yet. Go to <b>Settings</b> to run setup and generate your plan.</p></div>`;
  }
  const realToday = todayISO();
  let day = state.plan.find(d=>d.date===realToday);
  let note='';
  if(!day){
    if(state.plan.length===0){
      return renderQuoteBar() + `<div class="card"><h2>🎉 Syllabus complete!</h2><p class="sub">You've finished everything currently in your plan. Check <b>Progress</b> for your stats, or add more chapters in Settings.</p></div>` + renderOverallProgress();
    }
    const future = state.plan.filter(d=>d.date>=realToday);
    if(future.length>0){
      day = future[0];
      note = day.date!==realToday ? `<div class="note">No tasks land exactly on today. Showing your next scheduled day: ${fmtDate(day.date)}.</div>` : '';
    } else {
      return renderQuoteBar() + `<div class="card"><h2>🎉 Plan complete!</h2><p class="sub">You've reached the end of your generated plan. Check <b>Progress</b> to review, or adjust pace in Settings.</p></div>` + renderOverallProgress();
    }
  }
  const doneCt = day.items.filter(i=>i.done).length;
  const allDone = day.items.length>0 && doneCt===day.items.length;
  return renderQuoteBar() + renderPlanSummaryStrip() + `<div class="card">
    <h2>Today &middot; ${fmtDate(day.date)}</h2>
    <p class="sub">${day.items.length} task${day.items.length!==1?'s':''} scheduled${allDone?' — all done! 🎉':''}</p>

}

    rows += `<div class="taskrow">

}

function renderSubjectOrderList(){
  let rows='';
  state.subjectOrder.forEach((sid,i)=>{
    const s=subj(sid);
    rows+=`<div class="chapter-row"><div class="name">${s.name}</div>
      <div class="mini-order">
        <button data-act="subjmoveup" data-idx="${i}" ${i===0?'disabled':''}>▲</button>
        <button data-act="subjmovedown" data-idx="${i}" ${i===state.subjectOrder.length-1?'disabled':''}>▼</button>
      </div></div>`;
  });
  return `<div>${rows}</div>`;
}

let settingsActiveSubj = SUBJECTS[0].id;
function renderSettingsSubjectTabs(){
  let tabs = `<div class="subtabs">`;
  SUBJECTS.forEach(s=>{
    tabs += `<button data-act="ssubjtab" data-sub="${s.id}" class="${settingsActiveSubj===s.id?'active':''}">${s.name}</button>`;
  });
  tabs += `</div>`;
  return tabs + `<div>${renderChapterRows(settingsActiveSubj)}</div><button class="btn" id="s-saveChapters" style="margin-top:12px">Save &amp; Regenerate Plan</button>`;
}

function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* ---------------- EVENT HANDLING ---------------- */
function attachHandlers(){
  const themeBtn = document.getElementById('themeBtn');
  if(themeBtn) themeBtn.onclick = ()=>{ state.theme = state.theme==='dark'?'light':'dark'; saveState(); render(); };

  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.onclick = ()=>{ state.view = b.dataset.view; render(); };
  });

  // wizard step 0
  const wnext0 = document.getElementById('w-next0');
  if(wnext0) wnext0.onclick = ()=>{
    state.startDate = document.getElementById('w-start').value || state.startDate;
    state.targetDays = parseInt(document.getElementById('w-target').value)||60;
    state.wizardStep = 1; saveState(); render();
  };

  const wback = document.getElementById('w-back');
  if(wback) wback.onclick = ()=>{ state.wizardStep = Math.max(0,state.wizardStep-1); render(); };

  const wnextsub = document.getElementById('w-nextsub');
  if(wnextsub) wnextsub.onclick = ()=>{ state.wizardStep++; render(); };

  document.querySelectorAll('[data-act="wliveupdate"]').forEach(el=>{
    el.onchange = ()=>{
      if(el.id==='w-subjday') state.subjectsPerDay = parseInt(el.value)||2;
      if(el.id==='w-avgmin') state.avgLectureMinutes = Math.max(5,parseInt(el.value)||30);
      state.paceChoice = null;
      render();
    };
  });
  document.querySelectorAll('[data-act="wpicktier"]').forEach(el=>{
    el.onclick = ()=>{
      state.paceChoice = el.dataset.tier;
      state.lecturesPerDay = parseInt(el.dataset.lecperday)||2;
      render();
    };
  });
  const wnextpace = document.getElementById('w-nextpace');
  if(wnextpace) wnextpace.onclick = ()=>{ state.wizardStep = 7; saveState(); render(); };

  const wgen = document.getElementById('w-generate');
  if(wgen) wgen.onclick = ()=>{
    state.setupDone = true; state.view='today';
    generatePlan(); render();
  };

  // chapter row controls (both wizard & settings)
  document.querySelectorAll('[data-act="donetoggle"]').forEach(el=>{
    el.onchange = ()=>{
      const sid=el.dataset.sub, ch=el.dataset.ch;
      state.chapters[sid][ch].done = el.checked;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="modeselect"]').forEach(el=>{
    el.onchange = ()=>{
      const sid=el.dataset.sub, ch=el.dataset.ch;
      state.chapters[sid][ch].mode = el.value;
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-act="oneshotlink"]').forEach(el=>{
    el.onchange = ()=>{
      const sid=el.dataset.sub, ch=el.dataset.ch;
      state.chapters[sid][ch].oneshotLink = el.value;
      saveState();
    };
  });
  document.querySelectorAll('[data-act="moveup"]').forEach(el=>{
    el.onclick = ()=>{
      const sid=el.dataset.sub, i=parseInt(el.dataset.idx);
      const arr=state.chapterOrder[sid];
      if(i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-act="movedown"]').forEach(el=>{
    el.onclick = ()=>{
      const sid=el.dataset.sub, i=parseInt(el.dataset.idx);
      const arr=state.chapterOrder[sid];
      if(i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; saveState(); render(); }
    };
  });

  // today / full plan task toggles
  document.querySelectorAll('[data-act="tasktoggle"]').forEach(el=>{
    el.onchange = ()=>{
      const dayDate = el.dataset.day, id = el.dataset.id;
      const day = state.plan.find(d=>d.date===dayDate);
      let item = day ? day.items.find(i=>i.id===id) : null;
      if(item) item.done = el.checked;
      if(el.checked){
        state.completedItems[id] = true;
        if(item){
          state.completionLog.push({
            id, subject:item.subject, chapter:item.chapter,
            part: item.type==='oneshot' ? 'One Shot' : ('Lecture '+item.lectureNum),
            date: todayISO(), ts: Date.now()
          });
        }
      } else {
        delete state.completedItems[id];
        for(let i=state.completionLog.length-1;i>=0;i--){
          if(state.completionLog[i].id===id && state.completionLog[i].date===todayISO()){ state.completionLog.splice(i,1); break; }
        }
      }
      saveState(); render();
    };
  });

  document.querySelectorAll('[data-act="toggleday"]').forEach(el=>{
    el.onclick = ()=>{
      const d = el.dataset.day;
      state.openDay = state.openDay===d ? null : d;
      render();
    };
  });

  // skip today
  const openSkip = document.getElementById('openSkip');
  if(openSkip) openSkip.onclick = ()=>{ state.skipPromptOpen = true; render(); };
  const cancelSkip = document.getElementById('cancelSkip');
  if(cancelSkip) cancelSkip.onclick = ()=>{ state.skipPromptOpen = false; render(); };
  const confirmSkip = document.getElementById('confirmSkip');
  if(confirmSkip) confirmSkip.onclick = ()=>{
    const reason = document.getElementById('skipReason').value;
    skipToday(reason);
    state.skipPromptOpen = false;
    render();
  };

  // settings
  document.querySelectorAll('[data-act="settheme"]').forEach(el=>{
    el.onclick = ()=>{ state.theme = el.dataset.theme; saveState(); render(); };
  });
  const saveBaseline = document.getElementById('s-savebaseline');
  if(saveBaseline) saveBaseline.onclick = ()=>{
    state.startDate = document.getElementById('s-start').value || state.startDate;
    state.targetDays = parseInt(document.getElementById('s-target').value)||state.targetDays;
    generatePlan(); render();
  };

  const changePace = document.getElementById('s-changepace');
  if(changePace) changePace.onclick = ()=>{ state.settingsPaceEditing = true; render(); };
  const closePace = document.getElementById('s-closepace');
  if(closePace) closePace.onclick = ()=>{ state.settingsPaceEditing = false; saveState(); render(); };
  document.querySelectorAll('[data-act="sliveupdate"]').forEach(el=>{
    el.onchange = ()=>{
      if(el.id==='s-subjday2') state.subjectsPerDay = parseInt(el.value)||2;
      if(el.id==='s-avgmin2') state.avgLectureMinutes = Math.max(5,parseInt(el.value)||30);
      render();
    };
  });
  document.querySelectorAll('[data-act="spicktier"]').forEach(el=>{
    el.onclick = ()=>{
      state.paceChoice = el.dataset.tier;
      state.lecturesPerDay = parseInt(el.dataset.lecperday)||2;
      state.settingsPaceEditing = false;
      generatePlan(); render();
    };
  });

  document.querySelectorAll('[data-act="subjmoveup"]').forEach(el=>{
    el.onclick=()=>{ const i=parseInt(el.dataset.idx); if(i>0){ const a=state.subjectOrder; [a[i-1],a[i]]=[a[i],a[i-1]]; saveState(); render(); } };
  });
  document.querySelectorAll('[data-act="subjmovedown"]').forEach(el=>{
    el.onclick=()=>{ const i=parseInt(el.dataset.idx); const a=state.subjectOrder; if(i<a.length-1){ [a[i+1],a[i]]=[a[i],a[i+1]]; saveState(); render(); } };
  });
  document.querySelectorAll('[data-act="ssubjtab"]').forEach(el=>{
    el.onclick = ()=>{ settingsActiveSubj = el.dataset.sub; render(); };
  });
  const saveChapters = document.getElementById('s-saveChapters');
  if(saveChapters) saveChapters.onclick = ()=>{ generatePlan(); render(); };

  const exportBtn = document.getElementById('s-export');
  if(exportBtn) exportBtn.onclick = exportData;
  const importBtn = document.getElementById('s-importbtn');
  if(importBtn) importBtn.onclick = ()=>document.getElementById('s-importfile').click();
  const importFile = document.getElementById('s-importfile');
  if(importFile) importFile.onchange = (e)=>{ if(e.target.files[0]) importData(e.target.files[0]); };

  const rerun = document.getElementById('s-rerunwizard');
  if(rerun) rerun.onclick = ()=>{ state.setupDone = false; state.wizardStep = 0; saveState(); render(); };
  const hardReset = document.getElementById('s-hardreset');
  if(hardReset) hardReset.onclick = ()=>{
    if(confirm('This will permanently erase all your progress and settings on this device. Export a backup first if you want to keep it. Continue?')){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      state = defaultState();
      render();
    }
  };
}

/* ---------------- INIT ---------------- */
(function init(){
  loadState();
  ensurePlanFresh();
  render();
})();
</script>
</body>
</html>
